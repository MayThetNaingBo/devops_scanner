services:
  postgres:
    image: postgres:16
    container_name: codeguard-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: codeguard_ai
    volumes:
      - codeguard_pg_data:/var/lib/postgresql/data

volumes:
  codeguard_pg_data: